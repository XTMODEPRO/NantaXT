<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XT MODE PRO | Quantum Key Node</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #03060a; 
            --card-bg: rgba(8, 14, 24, 0.92); 
            --accent: #00ff88; 
            --accent-glow: rgba(0, 255, 136, 0.45);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --danger: #ff0055;
            --danger-glow: rgba(255, 0, 85, 0.4);
            --text: #e2e8f0;
            --border: rgba(0, 255, 136, 0.3);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Share Tech Mono', monospace; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
            overflow-x: hidden; position: relative;
        }

        /* Ambient Glow Spheres */
        .ambient-glow-1 {
            position: fixed; width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -150px; left: -150px; z-index: 1; filter: blur(70px);
            animation: floatGlow 8s infinite alternate ease-in-out;
        }
        .ambient-glow-2 {
            position: fixed; width: 450px; height: 450px; border-radius: 50%;
            background: radial-gradient(circle, var(--danger-glow) 0%, transparent 70%);
            bottom: -180px; right: -180px; z-index: 1; filter: blur(80px);
            animation: floatGlow 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 40px); }
        }

        /* Matrix Canvas */
        #matrixCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.12; pointer-events: none;
        }

        .container { 
            width: 100%; max-width: 440px; text-align: center; 
            position: relative; z-index: 10; margin: 10px 0;
        }

        /* Cyber Logo Header */
        .logo-wrapper {
            position: relative; width: 90px; height: 90px; margin: 0 auto 12px;
        }
        .logo-ring {
            position: absolute; inset: -6px; border-radius: 50%;
            border: 2px dashed var(--cyan);
            animation: rotateRing 15s linear infinite;
        }
        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .key-icon { 
            background: #000; width: 100%; height: 100%; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            border: 2px solid var(--accent); 
            box-shadow: 0 0 20px var(--accent-glow);
            overflow: hidden; position: relative; z-index: 2;
        }
        .key-icon img { width: 100%; height: 100%; object-fit: cover; }

        h1 { 
            font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; 
            letter-spacing: 2px; color: #fff; text-shadow: 0 0 10px var(--accent-glow); 
        }
        .subtitle { 
            color: var(--cyan); font-size: 11px; letter-spacing: 3px; 
            margin-bottom: 20px; text-transform: uppercase; opacity: 0.85;
        }

        /* Main Glass Card */
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 20px; padding: 24px 20px; 
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            position: relative; overflow: hidden;
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: scanLine 3s infinite;
        }
        @keyframes scanLine { 0% { left: -100%; } 100% { left: 100%; } }

        /* Status Grid */
        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px;
        }
        .info-box {
            background: rgba(0, 0, 0, 0.6); padding: 8px 12px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05); text-align: left;
        }
        .info-box label { 
            display: block; color: #64748b; font-size: 9px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .info-box strong { 
            color: var(--cyan); font-size: 11px; font-family: 'Share Tech Mono', monospace; 
            display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Main Key Box */
        .key-box { 
            background: rgba(0, 0, 0, 0.95); padding: 16px 10px; border-radius: 14px; 
            border: 1.5px dashed var(--accent); margin-bottom: 15px;
            box-shadow: inset 0 0 15px rgba(0,255,136,0.05);
            display: flex; justify-content: center; align-items: center; min-height: 60px;
        }
        #finalKey { 
            color: var(--accent); font-family: 'Orbitron', sans-serif; 
            font-size: 18px; font-weight: 800; letter-spacing: 2px;
            text-shadow: 0 0 12px var(--accent-glow); user-select: all;
            word-break: break-all;
        }

        /* Highlighted Expired Panel */
        .expired-panel {
            background: rgba(20, 5, 12, 0.85);
            border: 1px solid var(--danger);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 18px;
            box-shadow: 0 0 15px var(--danger-glow);
            position: relative;
        }

        .expired-title {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 10px; color: #ff88a8; text-transform: uppercase;
            letter-spacing: 1.5px; margin-bottom: 6px; font-weight: bold;
        }

        .expired-timer-digits {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px; font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 12px var(--danger);
            letter-spacing: 2px;
            margin: 4px 0;
        }

        .expired-date-info {
            font-size: 10px; color: #94a3b8; margin-bottom: 10px;
        }

        .progress-track {
            width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; overflow: hidden;
        }

        .progress-bar {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, var(--accent), var(--danger));
            transition: width 1s linear;
        }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; }

        .btn-main { 
            flex: 1; padding: 15px; 
            background: linear-gradient(135deg, var(--accent) 0%, #00b359 100%); 
            color: #000; border: none; border-radius: 12px; 
            font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900; 
            cursor: pointer; transition: all 0.25s ease; text-transform: uppercase;
            letter-spacing: 1px; box-shadow: 0 0 15px var(--accent-glow);
        }
        .btn-main:hover { 
            transform: translateY(-2px); box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
            background: #ffffff;
        }

        .btn-qr {
            width: 48px; background: rgba(0,240,255,0.1); color: var(--cyan);
            border: 1px solid var(--cyan); border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.25s ease;
        }
        .btn-qr:hover { 
            background: var(--cyan); color: #000; 
            box-shadow: 0 0 15px var(--cyan-glow); transform: translateY(-2px);
        }

        /* QR Drawer */
        #qrDrawer { 
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out;
            background: rgba(0,0,0,0.6); border-radius: 12px; margin-top: 0;
        }
        #qrDrawer.open { max-height: 180px; margin-top: 12px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); }
        #qrDrawer img { width: 110px; height: 110px; border-radius: 8px; border: 2px solid var(--cyan); }

        .footer { 
            margin-top: 20px; color: #475569; font-size: 9px; 
            letter-spacing: 2px; text-transform: uppercase; font-weight: 700; 
        }

        /* HUD Toast */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #000; color: var(--accent); border: 1px solid var(--accent);
            padding: 10px 22px; border-radius: 30px; font-family: 'Orbitron', sans-serif;
            font-size: 11px; font-weight: 700; letter-spacing: 1px; opacity: 0;
            box-shadow: 0 0 20px var(--accent-glow); transition: all 0.3s ease;
            z-index: 9999;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .spinner {
            width: 20px; height: 20px; border: 2px solid rgba(0, 255, 136, 0.2);
            border-top: 2px solid var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>
<div class="ambient-glow-1"></div>
<div class="ambient-glow-2"></div>

<div class="container">
    <div class="logo-wrapper">
        <div class="logo-ring"></div>
        <div class="key-icon">
            <img src="https://files.catbox.moe/jnelom.png" alt="XT MODE PRO" onerror="this.src='./assets/logo.png'">
        </div>
    </div>
    <h1>XT MODE PRO</h1>
    <p class="subtitle">Quantum License Node</p>

    <div class="card">
        <!-- Info Grid -->
        <div class="info-grid">
            <div class="info-box">
                <label>Target IP</label>
                <strong id="ipDisplay">Scanning...</strong>
            </div>
            <div class="info-box">
                <label>Security Lock</label>
                <strong style="color:var(--accent);">DEVICE BOUND</strong>
            </div>
        </div>

        <!-- Key Display Box -->
        <div class="key-box">
            <span id="finalKey"><div class="spinner"></div></span>
        </div>

        <!-- Prominent Expired Panel -->
        <div class="expired-panel">
            <div class="expired-title">
                <span>⚠️ KEY VALIDITY RESET</span>
                <span style="color:var(--danger); font-size:12px;">ACTIVE</span>
            </div>
            <div class="expired-timer-digits" id="countdown">00:00:00</div>
            <div class="expired-date-info">
                Expires at Midnight UTC (<span id="expiryDate">Loading...</span>)
            </div>
            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn-main" id="copyBtn" onclick="copyKey()">COPY ACCESS KEY</button>
            <button class="btn-qr" onclick="toggleQR()" title="Scan QR">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M2 2h2v2H2V2Z"/> <path d="M6 0v6H0V0h6ZM5 1H1v4h4V1ZM4 12H2v2h2v-2Z"/>
                    <path d="M6 10v6H0v-6h6Zm-5 1v4h4v-4H1Zm11-9h2v2h-2V2Z"/>
                    <path d="M10 0v6h6V0h-6Zm5 1v4h-4V1h4ZM8 1V0h1v2H8v2H7V1h1Zm0 5V4h1v2H8ZM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8H6Zm0 0v1H2V8H1v1H0V7h3v1h3Zm10 1h-1V7h1v2Zm-1 0h-1v2h2v-1h-1V9Zm-4 0h2v1h-1v1h-1V9Zm2 3v-1h-1v1h-1v1H9v1h3v-2h1Zm0 0h3v1h-2v1h-1v-2Zm-4-1v1H8v-2h2v1Zm0 2v1h2v-1H7v-1h1v1Z"/>
                </svg>
            </button>
        </div>

        <!-- QR Drawer -->
        <div id="qrDrawer">
            <p style="font-size: 9px; color: var(--cyan); margin-bottom: 6px; font-family:'Orbitron';">SCAN TO CONNECT DEVICE</p>
            <img id="qrImage" src="" alt="Key QR">
        </div>
    </div>

    <div class="footer">XT MODE PRO SECURITY SYSTEM</div>
</div>

<div id="toast">✔ COPIED TO CLIPBOARD</div>

<script>
    let generatedKeyText = "";

    // Web Audio Synthesizer SFX
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(freq = 800, duration = 0.08) {
        try {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    // --- LOGIKA UTAMA KEY GENERATOR BERDASARKAN HARI UTC ---
    async function generateLockedKey() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            const ip = data.ip;

            document.getElementById('ipDisplay').innerText = ip;

            // Menggunakan patokan waktu UTC untuk konsistensi pembuatan Key harian
            const nowUTC = new Date();
            const dayUTC = Math.floor(Date.UTC(nowUTC.getUTCFullYear(), nowUTC.getUTCMonth(), nowUTC.getUTCDate()) / 86400000);
            
            const ipSeed = parseInt(ip.replace(/\./g, '').substring(0, 6)); 
            let seed = ipSeed + dayUTC + 2026; 
            
            function rnd() { 
                var x = Math.sin(seed++) * 10000; 
                return Math.abs(x - Math.floor(x)); 
            }
            
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let segments = [];
            for(let i=0; i<4; i++) {
                let s = "";
                for(let j=0; j<4; j++) {
                    let r = Math.floor(rnd() * chars.length);
                    s += chars.charAt(r);
                }
                segments.push(s);
            }

            generatedKeyText = "FOXVPN-" + segments.join("-");
            document.getElementById('finalKey').innerText = generatedKeyText;

            // Generate QR Code
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${generatedKeyText}&color=00f0ff&bgcolor=000000`;

            startExpiryClock();
            playSound(1000, 0.1);

        } catch (err) {
            document.getElementById('ipDisplay').innerText = "DISCONNECTED";
            document.getElementById('finalKey').innerText = "CONNECT TO INTERNET";
        }
    }

    // --- SINKRONISASI WAKTU EXPIRED YANG AKURAT KE TENGAH MALAM UTC ---
    function startExpiryClock() {
        function updateTimer() {
            const now = new Date();
            
            // Hitung detik/milidetik menuju pergantian hari UTC berikutnya (00:00:00 UTC)
            const nextMidnightUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
            const remaining = nextMidnightUTC - now.getTime();

            if (remaining <= 0) {
                location.reload();
                return;
            }

            const hrs = Math.floor((remaining / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
            const mins = Math.floor((remaining / (1000 * 60)) % 60).toString().padStart(2, '0');
            const secs = Math.floor((remaining / 1000) % 60).toString().padStart(2, '0');

            document.getElementById('countdown').innerText = `${hrs}:${mins}:${secs}`;

            // Format tanggal/waktu lokal pengguna untuk menunjukkan batas expired dengan jelas
            const expiryObj = new Date(nextMidnightUTC);
            document.getElementById('expiryDate').innerText = expiryObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });

            // Bar Persentase Sisa Waktu (Total 24 Jam = 86400000 ms)
            const percentLeft = (remaining / 86400000) * 100;
            document.getElementById('progressBar').style.width = `${Math.max(0, Math.min(100, percentLeft))}%`;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    }

    function copyKey() {
        if(!generatedKeyText || generatedKeyText.includes("CONNECT")) return;

        playSound(900, 0.05);
        setTimeout(() => playSound(1300, 0.08), 50);

        navigator.clipboard.writeText(generatedKeyText).then(() => {
            showToast();
        }).catch(() => {
            const textArea = document.createElement("textarea");
            textArea.value = generatedKeyText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast();
        });
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function toggleQR() {
        playSound(700, 0.05);
        document.getElementById('qrDrawer').classList.toggle('open');
    }

    // Matrix Animation
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const chars = "0123456789ABCDEF";
    const fontSize = 11;
    let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(3, 6, 10, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff88';
        ctx.font = `${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 40);

    window.onload = generateLockedKey;
</script>
</body>
</html>
